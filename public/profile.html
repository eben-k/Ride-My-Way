<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ride-My-Way | Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container clearfix">
      <div id="branding">
        <h1><a href="index.html"><span class="highlight">Ride</span>-My-Way</a></h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="rides.html">Rides</a></li>
          <li class="current"><a href="profile.html">Profile</a></li>
          <li id="auth-slot"></li>
        </ul>
      </nav>
    </div>
  </header>

  <section id="main">
    <div class="container">
      <article id="history">
        <h1>My Profile</h1>

        <div id="message"></div>

        <div class="profile-stats">
          <div class="stat">
            <span class="count" id="given-count">0</span>
            Rides Given
          </div>
          <div class="stat">
            <span class="count" id="taken-count">0</span>
            Rides Taken
          </div>
        </div>

        <h2>Rides Given</h2>
        <ul class="ride-list" id="given-list"></ul>

        <h2>Rides Taken</h2>
        <ul class="ride-list" id="taken-list"></ul>
      </article>

      <aside id="sidebar">
        <div class="btn-group">
          <a href="offerride.html">Offer a Ride</a>
          <a href="rides.html">Browse Rides</a>
        </div>
      </aside>
    </div>
  </section>

  <footer>
    <p>Ride-My-Way, Copyright &copy; 2026</p>
  </footer>
  <script type="module" src="js/pages/nav.js"></script>
  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
