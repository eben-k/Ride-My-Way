<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ride-My-Way | Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container clearfix">
      <div id="branding">
        <h1><a href="index.html"><span class="highlight">Ride</span>-My-Way</a></h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="rides.html">Rides</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li id="auth-slot"></li>
        </ul>
      </nav>
    </div>
  </header>

  <section id="join">
    <div class="container">
      <form id="signin-form">
        <h1>Sign In</h1>
        <hr>

        <div id="message"></div>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter Username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>

        <label>
          <input type="checkbox" name="remember">
          Remember me
        </label>

        <div class="confirmation">
          <button type="button" class="cancel">Cancel</button>
          <button type="submit">Sign In</button>
        </div>

        <p class="auth-links">No account? <a href="signup.html">Sign Up</a></p>
      </form>
    </div>
  </section>

  <footer>
    <p>Ride-My-Way, Copyright &copy; 2026</p>
  </footer>
  <script type="module" src="js/pages/nav.js"></script>
  <script type="module" src="js/pages/signin.js"></script>
</body>
</html>
