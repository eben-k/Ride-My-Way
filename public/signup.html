<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ride-My-Way | Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container clearfix">
      <div id="branding">
        <h1><a href="index.html"><span class="highlight">Ride</span>-My-Way</a></h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="rides.html">Rides</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section id="join">
    <div class="container">
      <form>
        <h1>Sign Up</h1>
        <p>Please fill in this form to create an account.</p>
        <hr>

        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter Name" required>

        <label for="number">Contact Number</label>
        <input type="text" id="number" name="number" placeholder="Enter Number" required>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter Username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter Email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>

        <label for="password-repeat">Repeat Password</label>
        <input type="password" id="password-repeat" name="password-repeat" placeholder="Repeat Password" required>

        <p>By creating an account you agree to our Terms &amp; Privacy.</p>

        <div class="confirmation">
          <button type="button" class="cancel">Cancel</button>
          <button type="submit">Sign Up</button>
        </div>

        <p class="auth-links">Already have an account? <a href="signin.html">Sign In</a></p>
      </form>
    </div>
  </section>

  <footer>
    <p>Ride-My-Way, Copyright &copy; 2026</p>
  </footer>
</body>
</html>
